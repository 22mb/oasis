# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on RustSec advisories (vulnerabilities, unsoundness) and yanked crates.
yanked = "deny"

[licenses]
# Licenses compatible with MIT OR Apache-2.0 distribution.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Dependencies may only come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
