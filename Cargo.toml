[package]
name = "oasis-gen"
version = "0.10.2"
edition = "2024"
description = "Strictly typed API client generator for OpenAPI, with zero runtime dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/22mb/oasis"
keywords = ["openapi", "swagger", "codegen", "typescript", "client"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/ts/node_modules", "npm", "site", "docs", "playground"]

[dependencies]
serde = "1.0.229"
serde-saphyr = "2.0.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
# An integer overflow stops the program, as in a debug build, instead of
# wrapping around and continuing with a wrong number.
overflow-checks = true
lto = true
codegen-units = 1
strip = true

# The playground's WebAssembly module, built for size.
[profile.wasm]
inherits = "release"
opt-level = "s"

[workspace]
members = ["playground"]
