# Drafts a release's section of CHANGELOG.md from the titles of the pull
# requests merged since the last tag (see "Releasing" in CONTRIBUTING.md).
# Titles follow Conventional Commits; only the types below reach the changelog.

[changelog]
# Must match the top of CHANGELOG.md, so that --prepend inserts below it.
header = """
# Changelog

All notable changes to oasis-gen are listed here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/). Until 1.0.0, a minor version may
change the generated code or the CLI in incompatible ways.
"""
body = """
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/22mb/oasis/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}"""
trim = false
postprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/22mb/oasis/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
# Groups are listed in Keep a Changelog's order; the comments only sort them.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^fix\\(security\\)", group = "<!-- 3 -->Security" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
]
