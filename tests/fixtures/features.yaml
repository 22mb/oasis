# Edge cases: parameter serialization, servers, media type ranges, readOnly/writeOnly,
# discriminators, recursion (non-component $refs, arrays at the top of a schema, subtypes
# listed by their parent) and YAML 1.2 scalars.
openapi: 3.2.0
info:
  title: Features
  version: "1"
servers:
  - url: https://api.example.com
paths:
  /items/{coords}:
    parameters:
      - name: coords
        in: path
        required: true
        explode: true
        schema:
          type: object
          properties:
            x: { type: integer }
            y: { type: integer }
    get:
      operationId: getItem
      parameters:
        - name: X-Meta
          in: header
          explode: true
          schema:
            type: object
            additionalProperties: { type: string }
        - name: session
          in: cookie
          schema: { type: string }
        - name: list
          in: cookie
          style: cookie
          explode: false
          schema: { type: array, items: { type: string } }
        - name: raw
          in: cookie
          style: cookie
          schema: { type: string }
        - name: path
          in: query
          allowReserved: true
          schema: { type: string }
        - name: filter
          in: query
          content:
            application/json:
              schema:
                type: object
                properties:
                  a: { type: integer }
      responses:
        "200":
          description: Anything.
          content:
            "*/*": {}
        2XX:
          description: Another success.
        default:
          description: Fallback.
          content:
            application/*: {}
  /files/{dir}/{name}:
    parameters:
      - { name: dir, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      responses:
        "204":
          description: Found.
    delete:
      responses:
        "204":
          description: Deleted. The declared body is never sent, so it is not typed.
          content:
            application/json:
              schema: { type: object }
  /upload:
    servers:
      - url: https://upload.example.com
    post:
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema: { $ref: "#/components/schemas/Account" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /shapes:
    get:
      servers:
        - url: https://shapes.example.com/{version}
          variables:
            version:
              default: v2
              enum: [v1, v2]
      responses:
        "200":
          description: A shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shape" }
        "301":
          description: Moved.
        "404":
          description: No such shape.
        4XX:
          description: Any other client error.
          content:
            text/plain:
              schema: { type: string }
  /notes:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        "204":
          description: Saved.
    patch:
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        "204":
          description: Patched.
  /lookup:
    get:
      parameters:
        - name: q
          in: querystring
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags: { type: array, items: { type: string } }
      responses:
        "204":
          description: Found.
    post:
      parameters:
        - name: q
          in: querystring
          content:
            text/plain:
              schema: { type: string }
      responses:
        "204":
          description: Found.
  # Every serialization of arrays and objects, and operation-level servers over path-level ones.
  /params/{list}/{pair}:
    servers:
      - url: https://path.example.com
    get:
      servers:
        - url: https://operation.example.com
      parameters:
        - { name: list, in: path, required: true, schema: { type: array, items: { type: string } } }
        - name: pair
          in: path
          required: true
          schema: { type: object, properties: { x: { type: integer }, y: { type: integer } } }
        - { name: X-Ids, in: header, schema: { type: array, items: { type: integer } } }
        - name: X-Pair
          in: header
          schema: { type: object, additionalProperties: { type: string } }
        - name: obj
          in: query
          schema: { type: object, additionalProperties: { type: integer } }
        - name: flat
          in: query
          explode: false
          schema: { type: object, additionalProperties: { type: integer } }
        - name: deep
          in: query
          style: deepObject
          schema: { type: object, additionalProperties: { type: array, items: { type: integer } } }
        - { name: opt, in: query, schema: { type: [string, "null"] } }
        - { name: multi, in: cookie, schema: { type: array, items: { type: string } } }
      responses:
        "200":
          description: JSON or text.
          content:
            application/json:
              schema: { type: object, properties: { n: { type: integer } } }
            text/plain:
              schema: { type: string }
        "202":
          description: Items without a schema.
          content:
            application/jsonl: {}
  /forms/{id}:
    put:
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Form" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/Form" }
      responses:
        "204":
          description: Saved.
  /blobs:
    # No `responses`, and a form querystring without a schema.
    get:
      parameters:
        - name: q
          in: querystring
          content:
            application/x-www-form-urlencoded: {}
    post:
      requestBody:
        content:
          "*/*": {}
      responses:
        "204":
          description: Stored.
components:
  schemas:
    Account:
      title: Account
      description: A user account.
      type: object
      required: [id, name, password]
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string, default: anonymous }
        password: { type: string, writeOnly: true }
        owner: { $ref: "#/components/schemas/Owner" }
    Owner:
      type: object
      required: [ownerId]
      properties:
        ownerId: { type: integer, readOnly: true }
    Base:
      type: object
      properties:
        id: { type: integer }
        note: { type: string }
    WithId:
      allOf:
        - $ref: "#/components/schemas/Base"
      required: [id]
    Circle:
      type: object
      required: [kind, r]
      properties:
        kind: { type: string }
        r: { type: number }
    Square:
      type: object
      required: [kind, side]
      properties:
        kind: { type: string }
        side: { type: number }
    Shape:
      oneOf:
        - $ref: "#/components/schemas/Circle"
        - $ref: "#/components/schemas/Square"
      discriminator:
        propertyName: kind
        mapping:
          c: "#/components/schemas/Circle"
          s: "#/components/schemas/Square"
    Tree:
      $defs:
        node:
          type: object
          properties:
            value: { type: integer }
            left: { $ref: "#/components/schemas/Tree/$defs/node" }
            right: { $ref: "#/components/schemas/Tree/$defs/node" }
      $ref: "#/components/schemas/Tree/$defs/node"
    Flag:
      type: string
      enum: [N, Y, yes, off, A]
    Level:
      type: [integer, "null"]
      format: int32
      enum: [1, 2, null]
    Json:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: "null"
        - type: array
          items: { $ref: "#/components/schemas/Json" }
        - type: object
          additionalProperties: { $ref: "#/components/schemas/Json" }
    # A parent listing its subtypes, which extend it: the shape springdoc emits.
    Animal:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
      discriminator:
        propertyName: kind
      oneOf:
        - $ref: "#/components/schemas/Dog"
        - $ref: "#/components/schemas/Cat"
    Dog:
      allOf:
        - $ref: "#/components/schemas/Animal"
        - type: object
          properties:
            bark: { type: boolean }
    Cat:
      allOf:
        - $ref: "#/components/schemas/Animal"
        - type: object
          properties:
            lives: { type: integer }
    # A union of one variant renders as the variant, and still needs parentheses
    # next to `[]` and `&`.
    Tags:
      type: array
      items:
        oneOf:
          - type: string
            enum: [a, b]
    Tagged:
      allOf:
        - $ref: "#/components/schemas/Base"
        - oneOf:
            - anyOf:
                - $ref: "#/components/schemas/Circle"
                - $ref: "#/components/schemas/Square"
    # `defaultMapping`: the default variant takes every value the mapping does not list.
    Car:
      type: object
      required: [kind, doors]
      properties:
        kind: { type: string }
        doors: { type: integer }
    Bike:
      type: object
      required: [kind, gears]
      properties:
        kind: { type: string }
        gears: { type: integer }
    OtherVehicle:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
    Vehicle:
      oneOf:
        - $ref: "#/components/schemas/Car"
        - $ref: "#/components/schemas/Bike"
        - $ref: "#/components/schemas/OtherVehicle"
      discriminator:
        propertyName: kind
        mapping:
          car: "#/components/schemas/Car"
        defaultMapping: OtherVehicle
    # readOnly and writeOnly reach a property from the schema it references and
    # from another allOf member, which often lists it only in `required`.
    Serial: { type: integer, readOnly: true }
    Entity:
      type: object
      properties:
        serial: { $ref: "#/components/schemas/Serial" }
        secret: { type: string, writeOnly: true }
        label: { type: string }
    Entry:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - required: [serial, secret, label]
    Holder:
      type: object
      required: [serial]
      properties:
        serial: { $ref: "#/components/schemas/Serial" }
    # Named like a runtime export, so exported as `Client_2`.
    Client: { type: string }
    Form:
      type: object
      properties:
        tags: { type: array, items: { type: string } }
        note: { type: [string, "null"] }
    # `allOf` below the top of a schema: an intersection that needs parentheses in an
    # array, and readOnly reaching a property through it.
    Stamped:
      type: object
      properties:
        stamp:
          allOf:
            - $ref: "#/components/schemas/Serial"
            - { type: integer, minimum: 0 }
        pairs:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Base"
              - $ref: "#/components/schemas/Owner"
    # readOnly from a referenced schema reaches a property named in a nested `allOf`.
    Nested:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - allOf:
            - required: [serial]
            - properties:
                extra: { type: string }
    # A request shape for a schema hoisted from `$defs`.
    Doc:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/Doc/$defs/meta" }
      $defs:
        meta:
          type: object
          properties:
            rev: { type: integer, readOnly: true }
    Words: { items: { type: string } }
    Tuple:
      prefixItems: [{ type: string }]
      items: { type: number }
    OpenTuple:
      type: array
      prefixItems: [{ type: boolean }]
    Closed:
      type: object
      properties:
        x: { type: string }
      additionalProperties: false
    Empty: { type: object, additionalProperties: false }
    Constants:
      type: object
      required: [one, yes, nothing]
      properties:
        one: { const: 1 }
        yes: { const: true }
        nothing: { const: null }
    Described:
      type: object
      properties:
        owner:
          $ref: "#/components/schemas/Owner"
          description: Who owns it.
