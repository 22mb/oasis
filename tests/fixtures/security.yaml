# Security requirements: defaults, overrides, anonymous access, scopes,
# alternatives (OR) and combined schemes (AND).
openapi: 3.2.0
info:
  title: Security
  version: "1"
servers:
  - url: https://api.example.com
security:
  - bearer: []
paths:
  /login:
    post:
      operationId: login
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user: { type: string }
      responses:
        "204": { description: Logged in. }
  /pets:
    get:
      operationId: listPets
      security:
        - {}
        - bearer: []
      responses:
        "200":
          description: Pets, personalized when authenticated.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /me:
    get:
      responses:
        "204": { description: Inherits the top-level requirement. }
  /admin/users:
    delete:
      operationId: deleteUsers
      security:
        - oauth: [admin, write]
      responses:
        "204": { description: Deleted. }
  /webhooks:
    post:
      operationId: webhook
      security:
        - apiKey: []
      responses:
        "204": { description: Accepted. }
  /reports:
    get:
      operationId: reports
      parameters:
        - name: ids
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: integer } }
      security:
        - queryKey: []
        - basic: []
      responses:
        "204": { description: Either credential works. }
    post:
      operationId: createReport
      security:
        - queryKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string }
      responses:
        "204": { description: Created. }
  /both:
    get:
      operationId: both
      security:
        - apiKey: []
          session: []
      responses:
        "204": { description: Needs both. }
  /digest:
    get:
      operationId: digest
      security:
        - digest: []
      responses:
        "204": { description: An http scheme other than bearer and basic. }
  /oidc:
    get:
      operationId: oidc
      security:
        - oidc: []
      responses:
        "204": { description: An OpenID Connect token. }
  /mtls:
    get:
      operationId: mtls
      security:
        - mtls: []
      responses:
        "204": { description: A client certificate; nothing to add to the request. }
  /mtls-or-bearer:
    get:
      operationId: mtlsOrBearer
      security:
        - mtls: []
        - bearer: []
      responses:
        "204": { description: "A client certificate, or a bearer token when there is one." }
  /by-uri:
    get:
      operationId: byUri
      security:
        - "#/components/securitySchemes/bearer": []
      responses:
        "204": { description: A scheme named by its URI is the component of that name. }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    basic: { type: http, scheme: Basic }
    digest: { type: http, scheme: Digest }
    apiKey: { type: apiKey, in: header, name: X-API-Key }
    queryKey: { type: apiKey, in: query, name: api_key }
    session: { type: apiKey, in: cookie, name: sid }
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/token
          scopes: { admin: Administer, write: Write }
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration
    mtls: { type: mutualTLS }
