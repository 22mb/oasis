name: PR title

# The title becomes the squashed commit on main, and git-cliff drafts the
# changelog from those (cliff.toml), so it must follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  check:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|release|revert|style|test)(\([a-z0-9/_-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            {
              echo "::error title=Invalid PR title::The title must follow Conventional Commits."
              echo "Got:       $TITLE"
              echo "Expected:  <type>: <description>   e.g. feat: support QUERY operations"
              echo "Types:     build, chore, ci, docs, feat, fix, perf, refactor, release, revert, style, test"
              echo "Changelog: feat, fix and perf are listed; fix(security) goes under Security"
              echo "Breaking:  add ! before the colon, e.g. feat!: ..."
            } >&2
            exit 1
          fi
