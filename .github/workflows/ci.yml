name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Incremental builds only add to the cache; CI always starts from scratch.
# Line tables keep test backtraces readable at a fraction of the full debug info,
# which is slow to write on Windows. Changing this needs a new cache key prefix.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# One run per branch or pull request; a new push cancels the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt
      # Dependencies are cached per toolchain and Cargo.lock. Release builds never use the cache.
      - run: echo "RUSTC_VERSION=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: cargo-rust-v2-${{ runner.os }}-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-rust-v2-${{ runner.os }}-${{ env.RUSTC_VERSION }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The playground is a separate workspace. This checks that its lockfile is
      # current and that it still compiles against the library.
      - run: cargo check --locked --manifest-path playground/Cargo.toml

  # The release builds these platforms too; testing them here catches path and
  # line-ending differences before a tag is pushed. Linux runs the tests for the
  # musl target the release ships.
  rust-platforms:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - run: echo "RUSTC_VERSION=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: cargo-test-v3-${{ matrix.target }}-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-v3-${{ matrix.target }}-${{ env.RUSTC_VERSION }}-
      - run: cargo test --locked --target "$TARGET"
      # The npm launcher picks the binary by platform (`.exe` on Windows). The
      # debug build the tests made is enough.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pack the npm packages
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          exe=oasis-gen
          [[ "$RUNNER_OS" == Windows ]] && exe=oasis-gen.exe
          mkdir -p "artifacts/$TARGET"
          cp "target/$TARGET/debug/$exe" "artifacts/$TARGET/"
          node npm/build.mjs "$version" artifacts npm-dist --partial
          mkdir tarballs project
          (cd tarballs && npm pack ../npm-dist/platforms/* ../npm-dist/oasis-gen)
          (cd project && npm init -y > /dev/null)
      - name: Install the packed tarballs
        working-directory: project
        run: npm install ../tarballs/*.tgz
      - name: Run the installed CLI
        working-directory: project
        run: |
          npx oasis-gen ../tests/fixtures/petstore.yaml -o api.ts
          head -1 api.ts | grep -q "Generated by oasis-gen"

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    defaults:
      run:
        working-directory: tests/ts
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      # Current TypeScript, then the oldest supported one (both locked in package-lock.json).
      - run: npm test
      - run: npm run check:ts5.0
      # Without the dom lib, as Node-only tsconfigs are set up.
      - run: npm run check:no-dom
      # Without Node's types, as browser projects are set up.
      - run: npm run check:browser
      # The oldest supported Node.js.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test
      # The generated client also runs in Bun.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: npm run test:bun
