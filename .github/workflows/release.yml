name: Release

# Push a tag `v<version>` matching Cargo.toml to build
# binaries for every platform, attest them, publish the npm packages and
# publish a GitHub release. The release is created as a draft and published
# last, which works with immutable releases (assets cannot change afterwards).
# Run it by hand (workflow_dispatch) to build every platform without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches Cargo.toml
        if: github.event_name == 'push'
        run: test "v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/oasis-gen${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    # Only a pushed tag publishes; a manual run from any ref stops after the builds.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Protect with required reviewers and a `v*` tag rule in the repository settings.
    environment: release
    permissions:
      contents: write # create and publish the GitHub release
      id-token: write # OIDC for npm trusted publishing, npm provenance and attestations
      attestations: write # store build provenance attestations
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that npm supports trusted publishing (>= 11.5.1)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Smoke-test the Linux binary
        run: |
          chmod +x artifacts/x86_64-unknown-linux-musl/oasis-gen
          artifacts/x86_64-unknown-linux-musl/oasis-gen tests/fixtures/petstore.yaml > /dev/null
      - run: node npm/build.mjs "${GITHUB_REF_NAME#v}" artifacts npm-dist
      - name: Package release archives
        run: |
          mkdir release
          for dir in artifacts/*; do
            target=$(basename "$dir")
            cp LICENSE-MIT LICENSE-APACHE "$dir/"
            if [[ "$target" == *windows* ]]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/release/oasis-gen-$target.zip" oasis-gen.exe LICENSE-MIT LICENSE-APACHE)
            else
              chmod +x "$dir/oasis-gen"
              tar -czf "release/oasis-gen-$target.tar.gz" -C "$dir" oasis-gen LICENSE-MIT LICENSE-APACHE
            fi
          done
          (cd release && sha256sum oasis-gen-* > SHA256SUMS)
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release/oasis-gen-*
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > draft 2>/dev/null; then
            # Re-run: replace assets on a draft; a published release is final.
            if [[ "$(cat draft)" == true ]]; then gh release upload "$GITHUB_REF_NAME" release/* --clobber; fi
          else
            # The notes are the version's section of CHANGELOG.md, which must exist.
            awk -v heading="## [${GITHUB_REF_NAME#v}]" \
              '/^## \[/ { if (found) exit; found = index($0, heading) == 1; next } found' CHANGELOG.md > notes.md
            test -s notes.md
            flags=()
            [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" release/* --draft --notes-file notes.md --verify-tag "${flags[@]}"
          fi
      - name: Publish to npm
        env:
          # Only for the first publish of each package. Afterwards, configure trusted
          # publishing for every package on npmjs.com, then remove this `env` entry
          # (npm then authenticates with OIDC) and delete the NPM_TOKEN secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          [[ "$version" == *-* ]] && tag=next
          # Platform packages first, so the main package's optional dependencies resolve.
          for dir in npm-dist/platforms/* npm-dist/oasis-gen; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$dir" --access public --provenance --tag "$tag"
            fi
          done
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
