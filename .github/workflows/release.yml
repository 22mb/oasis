name: Release

# Merging a release pull request (`release: <version>`, from prepare-release.yml)
# tags its commit `v<version>`, builds binaries for every platform, attests them,
# publishes the npm packages and publishes a GitHub release. Other pushes to main
# stop after the first job. To retry a failed release, re-run its failed jobs;
# steps already done are skipped. The release is created as a draft and
# published last, which works with immutable releases (assets cannot change
# afterwards).
# Run it by hand (workflow_dispatch) to build every platform without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.title.outputs.release }}
      version: ${{ steps.title.outputs.version }}
    steps:
      - id: title
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # The squashed commit's title is the pull request's, with ` (#<number>)` appended.
          title=${MESSAGE%%$'\n'*}
          if [[ "$GITHUB_EVENT_NAME" == push && "$title" =~ ^release:\ ([0-9][^ ]*)( \(#[0-9]+\))?$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check that the release's version matches Cargo.toml
        if: needs.version.outputs.release == 'true'
        run: test "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" = "$VERSION"
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/oasis-gen${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build]
    # Only a release commit on main publishes; a manual run stops after the builds.
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The environment accepts only main, where only merged pull requests land:
    # a `v*` tag pushed by anyone else cannot publish.
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    permissions:
      contents: write # create and publish the GitHub release
      id-token: write # OIDC for npm trusted publishing, npm provenance and attestations
      attestations: write # store build provenance attestations
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that npm supports trusted publishing (>= 11.5.1)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Smoke-test the Linux binary
        run: |
          chmod +x artifacts/x86_64-unknown-linux-musl/oasis-gen
          artifacts/x86_64-unknown-linux-musl/oasis-gen tests/fixtures/petstore.yaml > /dev/null
      - run: node npm/build.mjs "$VERSION" artifacts npm-dist
      - name: Package release archives
        run: |
          mkdir release
          for dir in artifacts/*; do
            target=$(basename "$dir")
            cp LICENSE-MIT LICENSE-APACHE "$dir/"
            if [[ "$target" == *windows* ]]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/release/oasis-gen-$target.zip" oasis-gen.exe LICENSE-MIT LICENSE-APACHE)
            else
              chmod +x "$dir/oasis-gen"
              tar -czf "release/oasis-gen-$target.tar.gz" -C "$dir" oasis-gen LICENSE-MIT LICENSE-APACHE
            fi
          done
          (cd release && sha256sum oasis-gen-* > SHA256SUMS)
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release/oasis-gen-*
      # The `release tags` ruleset keeps `v*` tags from being moved or deleted.
      - name: Tag the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null); then
            # Re-run: the tag exists, and must be on this commit.
            test "$commit" = "$GITHUB_SHA"
          else
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="oasis-gen $VERSION" \
              -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          fi
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft 2>/dev/null; then
            # Re-run: replace assets on a draft; a published release is final.
            if [[ "$(cat draft)" == true ]]; then gh release upload "$TAG" release/* --clobber; fi
          else
            # The notes are the version's section of CHANGELOG.md, which must exist, with
            # wrapped lines joined: GitHub shows every line break in release notes.
            awk -v heading="## [$VERSION]" '
              function flush() { if (have) print buf; have = 0 }
              /^## \[/ { if (found) { flush(); exit } found = index($0, heading) == 1; next }
              !found { next }
              /^```/ { flush(); code = !code; print; next }
              code { print; next }
              /^$/ || /^#/ { flush(); print; next }
              /^(- |\* |\| )/ { flush(); buf = $0; have = 1; next }
              { line = $0; sub(/^ +/, "", line); if (have) buf = buf " " line; else { buf = $0; have = 1 } }
              END { flush() }
            ' CHANGELOG.md > notes.md
            test -s notes.md
            flags=()
            [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" release/* --draft --notes-file notes.md --verify-tag "${flags[@]}"
          fi
      # npm authenticates with OIDC: every package trusts this workflow's `release`
      # environment as its trusted publisher (`npm trust github`).
      - name: Publish to npm
        run: |
          version="$VERSION"
          tag=latest
          [[ "$version" == *-* ]] && tag=next
          # Platform packages first, so the main package's optional dependencies resolve.
          for dir in npm-dist/platforms/* npm-dist/oasis-gen; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              # `./` keeps npm from reading `npm-dist/oasis-gen` as a GitHub `owner/repo`.
              npm publish "./$dir" --access public --provenance --tag "$tag"
            fi
          done
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi
