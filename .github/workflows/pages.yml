name: Pages

# Build the documentation site in site/ on every change to it, and deploy it
# to GitHub Pages from main. Pull requests only build, which catches dead links.
on:
  push:
    branches: [main]
    paths: [site/**, tests/golden/**, .github/workflows/pages.yml]
  pull_request:
    paths: [site/**, tests/golden/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions: {}

# A new push cancels the previous run, except a deployment in progress on main.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # deploy
      id-token: write # verify the deployment's origin
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
