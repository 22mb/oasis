# Updates wait 7 days after a release (`cooldown`), so a compromised version
# is more likely to be caught and yanked before it is proposed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /tests/ts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Twoslash needs TypeScript's JavaScript API, which TypeScript 7 changed
      # (twoslashes/twoslash#93).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Shiki's major version must match the one VitePress 1 bundles (2.x).
      - dependency-name: "@shikijs/*"
        update-types: ["version-update:semver-major"]
