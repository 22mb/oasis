# Updates wait 7 days after a release (`cooldown`), so a compromised version
# is more likely to be caught and yanked before it is proposed here. Titles
# start with `chore(deps):`, which keeps them out of the changelog (cliff.toml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /tests/ts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Twoslash needs TypeScript's JavaScript API, which TypeScript 7 changed
      # (twoslashes/twoslash#93).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The playground highlights code with Shiki directly, and its output must
      # look like the code blocks Rspress renders with its bundled Shiki (4.x).
      - dependency-name: shiki
        update-types: ["version-update:semver-major"]
      # Rspress itself depends on React 19, so a second major version next
      # to it would give the theme's components their own copy of React.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
    groups:
      # Packages that only work when their versions match.
      react:
        patterns: ["react", "react-dom", "@types/react"]
      rspress:
        patterns: ["@rspress/*"]
