# Updates wait 7 days after a release (`cooldown`), so a compromised version
# is more likely to be caught and yanked before it is proposed here. Titles
# start with `chore(deps):`, which keeps them out of the changelog (cliff.toml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /tests/ts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Twoslash needs TypeScript's JavaScript API, which TypeScript 7 changed
      # (twoslashes/twoslash#93).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The playground highlights with Shiki itself, and its output must look
      # like the code blocks that Rspress renders with the Shiki it bundles (4.x).
      - dependency-name: shiki
        update-types: ["version-update:semver-major"]
      # Rspress depends on React 19 itself; a second major next to it would
      # give the theme's components a React of their own.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
    groups:
      # Packages that only work at the same version as each other.
      react:
        patterns: ["react", "react-dom", "@types/react"]
      rspress:
        patterns: ["@rspress/*"]
