# Updates wait 7 days after a release (`cooldown`), so a compromised version
# is more likely to be caught and yanked before it is proposed here. Titles
# start with `chore(deps):`, which keeps them out of the changelog (cliff.toml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /tests/ts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Twoslash needs TypeScript's JavaScript API, which TypeScript 7 changed
      # (twoslashes/twoslash#93).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Shiki's major version must match the one VitePress 2 bundles (4.x).
      - dependency-name: "@shikijs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: shiki
        update-types: ["version-update:semver-major"]
